(() =&gt; {

    state.chatOpen=true;

    else if(kind===&#x27;checks&#x27;) answer=`En ${d.device}, ejecuta «show vlan brief» y revisa las VLAN ${d.a} y ${d.b} y sus puertos. Pega aquí la salida, en Comprobaciones. Después prueba la conectividad prevista entre equipos; la salida de VLAN por sí sola no demuestra conectividad.`;
    else if(/verific|funcion|listo|correct/i.test(question)) answer=&#x27;La propuesta todavía necesita evidencia del laboratorio. Una configuración generada no equivale a una práctica verificada. En Comprobaciones puedes aportar la salida del switch y contrastar la pertenencia de sus puertos.&#x27;;
    else answer=`Estoy revisando ${d.device}: Administración en VLAN ${d.a} y Laboratorio en VLAN ${d.b}. En este mockup puedes explorar «¿Por qué este comando?» y «¿Cómo lo compruebo?» para ver cómo el chat usaría el caso abierto.`;

  }
  restore(saved,true);renderCase();tab(state.tab,false);chatRender();
  root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(el=&gt;el.addEventListener(&#x27;click&#x27;,()=&gt;tab(el.dataset.tab)));
  root.querySelectorAll(&#x27;[data-nav]&#x27;).forEach(el=&gt;el.addEventListener(&#x27;click&#x27;,()=&gt;tab(el.dataset.nav===&#x27;sources&#x27;?&#x27;sources&#x27;:&#x27;config&#x27;)));
  root.querySelector(&#x27;.nl-brand&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{e.preventDefault();tab(&#x27;config&#x27;);});
  $(&#x27;nl-go-checks&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;tab(&#x27;checks&#x27;));
  $(&#x27;nl-minimize&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{state.chatOpen=!state.chatOpen;chatRender();save();});
  $(&#x27;nl-expand&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{state.expanded=!state.expanded;state.chatOpen=true;chatRender();save();});
  root.querySelectorAll(&#x27;[data-question]&#x27;).forEach(el=&gt;el.addEventListener(&#x27;click&#x27;,()=&gt;ask(el.dataset.question)));
  $(&#x27;nl-explain-command&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;ask(&#x27;access&#x27;));
  $(&#x27;nl-chat-form&#x27;).addEventListener(&#x27;submit&#x27;,e=&gt;{e.preventDefault();const q=$(&#x27;nl-chat-input&#x27;).value.trim();if(!q)return;ask(/compro|prueba|salida|evidencia/i.test(q)?&#x27;checks&#x27;:/access|comando|por qu[eé]/i.test(q)?&#x27;access&#x27;:&#x27;other&#x27;,q);$(&#x27;nl-chat-input&#x27;).value=&#x27;&#x27;;});
  $(&#x27;nl-case-form&#x27;).addEventListener(&#x27;submit&#x27;,e=&gt;{

    const pA=range(d.portsA),pB=range(d.portsB);let error=&#x27;&#x27;;
    if(!d.device || !d.ios)error=&#x27;Completa el nombre del equipo y la versión IOS antes de generar.&#x27;;
    else if(!Number.isInteger(d.a)||!Number.isInteger(d.b)||d.a&lt;2||d.b&lt;2||d.a&gt;1001||d.b&gt;1001||d.a===d.b)error=&#x27;Usa dos VLAN distintas entre 2 y 1001 para este escenario de ejemplo.&#x27;;
    else if(!/^[A-Za-z0-9_-]{1,32}$/.test(d.nameA)||!/^[A-Za-z0-9_-]{1,32}$/.test(d.nameB))error=&#x27;Los nombres admiten letras sin espacios, números, guion y guion bajo.&#x27;;

    state.caseData=d;renderCase(false);tab(&#x27;config&#x27;);$(&#x27;nl-case-status&#x27;).lastChild.textContent=&#x27; Propuesta por contrastar&#x27;;$(&#x27;nl-case-status&#x27;).style.color=&#x27;var(--nl-warn)&#x27;;
    $(&#x27;nl-evidence&#x27;).value=&#x27;&#x27;;$(&#x27;nl-check-result&#x27;).querySelector(&#x27;h3&#x27;).textContent=&#x27;Aún sin evidencia&#x27;;$(&#x27;nl-check-result&#x27;).querySelector(&#x27;p&#x27;).textContent=&#x27;La nueva propuesta espera una salida del laboratorio.&#x27;;
    $(&#x27;nl-chat-answer&#x27;).textContent=`Propuesta de referencia actualizada para ${d.device}: Administración en VLAN ${d.a} y Laboratorio en VLAN ${d.b}. Aún no se ha comprobado en tu laboratorio.`;
